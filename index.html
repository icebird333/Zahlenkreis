<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Vier Zahlenkreise – Vollversion</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f3f6ff}main{max-width:820px;margin:auto;padding:12px 12px 32px}h1{font-size:clamp(20px,4vw,29px);text-align:center;margin:5px 0 9px}.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:4px 0 9px}.stat{background:#1e2c43;border-radius:10px;padding:8px 14px;text-align:center;min-width:105px}.stat small{display:block;color:#aebed6}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}.board{width:min(100%,700px);margin:auto;position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:manipulation;border-radius:50%;background:#121e31}.actions{display:flex;gap:9px;justify-content:center;margin:13px 0;flex-wrap:wrap}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:11px;padding:11px 17px;background:#315a91;color:white;min-width:104px}button.primary{background:#16836d}button:disabled{opacity:.5}button:active{filter:brightness(1.3)}.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:#1e2c43;border-radius:14px;padding:15px}.setting label{display:flex;justify-content:space-between;gap:5px;margin-bottom:8px}.setting input{width:100%;accent-color:#5cc7e6}.options{display:flex;gap:16px;flex-wrap:wrap;margin:12px 3px;color:#dce8fa}.options label{cursor:pointer}.note{text-align:center;color:#aebed6;font-size:13px;line-height:1.45;margin:12px 0}.message{text-align:center;min-height:25px;font-weight:700;color:#8ee4c3} @media(max-width:430px){main{padding:8px 6px 24px}.stat{min-width:90px;padding:5px 8px}.stat strong{font-size:18px}.settings{padding:11px}.actions button{min-width:89px;padding:10px 12px}}
</style></head><body><main><h1>Vier Zahlenkreise</h1><div class="stats"><div class="stat"><small>Gesucht</small><strong id="targetTop">1</strong></div><div class="stat"><small>Zeit</small><strong id="clock">00:00,0</strong></div><div class="stat"><small>Treffer</small><strong id="progress">0 / 48</strong></div></div><div class="board"><canvas id="game" width="700" height="700" aria-label="Vier rotierende Zahlenringe zum Antippen"></canvas></div><div class="message" id="message" aria-live="polite">Start drücken und die Zahlen aufsteigend antippen.</div><div class="actions"><button class="primary" id="start">Start</button><button id="pause">Pause</button><button id="reset">Neustart</button><button id="fullscreen">Vollbild</button></div><div class="settings"><div class="setting"><label for="count">Zahlenmenge <b id="countVal">48</b></label><input type="range" id="count" min="30" max="64" value="48" step="1"></div><div class="setting"><label for="speed">Tempo <b id="speedVal">4</b></label><input type="range" id="speed" min="1" max="10" value="4" step="1"></div></div><div class="options"><label><input type="checkbox" id="upright" checked> Zahlen aufrecht anzeigen</label><label><input type="checkbox" id="sound" checked> Bestätigungston</label></div><p class="note">Vier abwechselnd gegenläufige Ringe · richtige Zahlen bleiben grün markiert · falsche Eingaben blinken rot · Einstellungen auch während des Spiels änderbar.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),count=$('count'),speed=$('speed');let total=+count.value,tempo=+speed.value,numbers=[],hit=new Set(),next=1,running=false,started=false,done=false,elapsed=0,last=0,angles=[0,0,0,0],positions=[],flash=null,audio=null;const TAU=Math.PI*2;function timeText(t){let ds=Math.floor(t/100),s=Math.floor(ds/10),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+','+(ds%10)}function update(){ $('clock').textContent=timeText(elapsed);$('targetTop').textContent=done?'✓':next;$('progress').textContent=hit.size+' / '+total;$('start').textContent=running?'Läuft':started&&!done?'Weiter':'Start';$('start').disabled=running||done;$('pause').disabled=!running;}function init(){total=+count.value;numbers=Array.from({length:total},(_,i)=>i+1);for(let i=numbers.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[numbers[i],numbers[j]]=[numbers[j],numbers[i]]}hit.clear();next=1;elapsed=0;running=false;started=false;done=false;angles=[0,0,0,0];flash=null;$('message').textContent='Start drücken und die Zahlen aufsteigend antippen.';update();draw()}function tone(ok){if(!$('sound').checked)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=ok?880:220;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.13:.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.10)}catch(e){}}function draw(){const dpr=Math.min(window.devicePixelRatio||1,2),size=Math.max(250,Math.min(canvas.getBoundingClientRect().width||700,700));let px=Math.round(size*dpr);if(canvas.width!==px){canvas.width=px;canvas.height=px}ctx.setTransform(px/700,0,0,px/700,0,0);ctx.clearRect(0,0,700,700);const cx=350,cy=350,radii=[114,177,240,303],band=53;positions=[];for(let ring=3;ring>=0;ring--){let r=radii[ring];ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle=ring%2?'#293f5d':'#233650';ctx.lineWidth=band;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.strokeStyle='#536b89';ctx.lineWidth=1.5;ctx.stroke()}let groups=[[],[],[],[]];numbers.forEach((n,i)=>groups[i%4].push(n));for(let ring=0;ring<4;ring++){let arr=groups[ring],r=radii[ring];arr.forEach((n,i)=>{let a=angles[ring]-Math.PI/2+i*TAU/arr.length,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;positions.push({n,x,y});const correct=hit.has(n),bad=flash&&flash.n===n&&performance.now()<flash.until;ctx.save();ctx.translate(x,y);if(!$('upright').checked)ctx.rotate(a+Math.PI/2);if(correct||bad){ctx.beginPath();ctx.arc(0,0,Math.min(20,Math.PI*r/arr.length*.9),0,TAU);ctx.fillStyle=correct?'#168b68':'#bd404b';ctx.fill()}ctx.font='bold 24px system-ui,Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=correct?'#fff':bad?'#fff':'#f4f7ff';ctx.fillText(n,0,1);ctx.restore()})}ctx.beginPath();ctx.arc(cx,cy,71,0,TAU);ctx.fillStyle='#0b1525';ctx.fill();ctx.strokeStyle='#6f9ab7';ctx.lineWidth=3;ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=done?'#7ce0b0':'#fff';ctx.font='bold 61px system-ui,Arial';ctx.fillText(done?'✓':next,cx,cy+4);ctx.font='16px system-ui';ctx.fillStyle='#9cb3ce';ctx.fillText(done?'Fertig':'GESUCHT',cx,cy+49)}function tick(now){if(last===0)last=now;let dt=Math.min(now-last,100);last=now;if(running){elapsed+=dt;const rate=.045+tempo*.032;for(let i=0;i<4;i++)angles[i]+=(i%2?-1:1)*rate*dt/1000;update()}draw();requestAnimationFrame(tick)}canvas.addEventListener('pointerdown',e=>{if(!running)return;let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*700,y=(e.clientY-rect.top)/rect.height*700;let best=null,dist=Infinity;for(const p of positions){let d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=p}}if(!best||dist>27)return;if(best.n===next){hit.add(next);tone(true);next++;if(next>total){running=false;done=true;$('message').textContent='Geschafft! Gesamtzeit: '+timeText(elapsed);update()}}else{flash={n:best.n,until:performance.now()+230};tone(false)}});$('start').onclick=()=>{if(done)return;running=true;started=true;$('message').textContent='Finde die Zahl '+next;update()};$('pause').onclick=()=>{running=false;$('message').textContent='Pausiert';update()};$('reset').onclick=init;count.oninput=()=>{$('countVal').textContent=count.value;init()};speed.oninput=()=>{tempo=+speed.value;$('speedVal').textContent=speed.value};$('upright').onchange=draw;$('fullscreen').onclick=()=>{let el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{$('message').textContent='Vollbild wird von diesem Browser nicht unterstützt.'});else if(document.exitFullscreen)document.exitFullscreen()};window.addEventListener('resize',draw);init();requestAnimationFrame(tick)})();
</script></body></html>
