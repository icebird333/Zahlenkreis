<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zahlenkreis"><title>Zahlenkreis</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:white;font:16px system-ui,sans-serif;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:5px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:18px;margin:2px}label{font-size:13px}input{width:95px}button{border:0;border-radius:9px;background:#2563eb;color:white;padding:9px 13px;font-weight:700}#status{font-size:13px;color:#cbd5e1}#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}svg{display:block;touch-action:manipulation;max-width:100%;max-height:100%}.num{font-weight:700;fill:#fff;cursor:pointer;user-select:none}.hit{fill:#22c55e!important}.ring{fill:none;stroke:#475569;stroke-width:1.5}.center{fill:#172554;stroke:#60a5fa;stroke-width:3}#target{fill:white;font-size:32px;font-weight:800;text-anchor:middle;dominant-baseline:middle}#timer{font-variant-numeric:tabular-nums;font-weight:750;color:#93c5fd}#bottom{display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px;padding-bottom:3px}</style></head><body><main><header><h1>Vier Zahlenkreise</h1><label>Zahlen <input id="count" type="range" min="30" max="64" value="48"><b id="countV">48</b></label><label>Tempo <input id="speed" type="range" min="0" max="100" value="35"><b id="speedV">35</b></label><button id="restart">Neustart</button></header><div id="status">Tippe die Zahl in der Mitte an ihrem Platz im Ring an.</div><div id="board"><svg id="svg" viewBox="0 0 600 600" aria-label="Zahlenkreise"></svg></div><div id="bottom"><span id="progress">0 / 48 getroffen</span><span id="timer">Zeit: 00:00,0</span><button id="pause">Pause</button></div></main><script>const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#svg'),count=document.querySelector('#count'),speed=document.querySelector('#speed'),target=document.querySelector('#target'),progress=document.querySelector('#progress');let groups=[],numbers=[],found=new Set(),wanted=1,paused=false,last=0,elapsed=0,finished=false;function clock(){let d=Math.floor(elapsed/100),m=Math.floor(d/600),sec=Math.floor(d/10)%60,t=d%10;document.querySelector("#timer").textContent="Zeit: "+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+","+t}function el(tag,attrs={},parent=svg){let x=document.createElementNS(NS,tag);for(let k in attrs)x.setAttribute(k,attrs[k]);parent.appendChild(x);return x}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function build(){svg.replaceChildren();groups=[];found=new Set();paused=false;finished=false;elapsed=0;clock();document.querySelector('#pause').textContent='Pause';let n=+count.value;document.querySelector('#countV').textContent=n;let all=shuffle(Array.from({length:n},(_,i)=>i+1));let radii=[264,207,151,95],sizes=[18,19,20,21];let offset=0;for(let r=0;r<4;r++){let len=Math.floor(n/4)+(r<n%4?1:0),arr=all.slice(offset,offset+len);offset+=len;el('circle',{cx:300,cy:300,r:radii[r],class:'ring'});let g=el('g');let start=Math.random()*360;groups.push({g,angle:start,dir:r%2?-1:1});arr.forEach((num,i)=>{let a=2*Math.PI*i/len-Math.PI/2,x=300+radii[r]*Math.cos(a),y=300+radii[r]*Math.sin(a);let t=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle','font-size':sizes[r],class:'num'},g);t.textContent=num;t.addEventListener('click',()=>hit(num,t));});}el('circle',{cx:300,cy:300,r:46,class:'center'});let t=el('text',{x:300,y:300,id:'target'});wanted=1;update();last=performance.now()}function hit(n,t){if(paused||found.has(n))return;if(n===wanted){found.add(n);t.classList.add('hit');wanted++;update();if(wanted>+count.value){paused=true;finished=true;document.querySelector('#pause').textContent='Fertig';document.querySelector('#status').textContent='Geschafft! Alle Zahlen gefunden. Gesamtzeit: '+document.querySelector('#timer').textContent.replace('Zeit: ','')}}else{document.querySelector('#status').textContent='Gesucht ist '+wanted+' – versuche es erneut.'}}function update(){document.querySelector('#progress').textContent=found.size+' / '+count.value+' getroffen';document.querySelector('#target').textContent=wanted<=+count.value?wanted:'✓';document.querySelector('#status').textContent=wanted<=+count.value?'Finde die Zahl '+wanted+'.':'Geschafft!'}function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){elapsed+=Math.max(0,Math.min((now-(last-dt*1000))/1000,0));elapsed+=dt;clock();let s=+speed.value;for(let i=0;i<4;i++){let o=groups[i];if(o){o.angle+=o.dir*(s/100)*24*dt*(1+i*.14);o.g.setAttribute('transform',`rotate(${o.angle} 300 300)`);for(let t of o.g.children)t.setAttribute('transform',`rotate(${-o.angle} ${t.getAttribute('x')} ${t.getAttribute('y')})`)}}}requestAnimationFrame(frame)}count.addEventListener('input',build);speed.addEventListener('input',()=>document.querySelector('#speedV').textContent=speed.value);document.querySelector('#restart').onclick=build;document.querySelector('#pause').onclick=()=>{if(finished)return;paused=!paused;document.querySelector('#pause').textContent=paused?'Weiter':'Pause'};build();requestAnimationFrame(frame);</script></body></html>
